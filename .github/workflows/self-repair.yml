name: Self-Repair Demo

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "fake = scripted patch (no API key needed), env = real model via secrets"
        type: choice
        default: fake
        options: [fake, env]

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Inject a bug into a repo copy and let the harness repair it
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scripts/demo_self_repair.py --provider ${{ inputs.provider }}
