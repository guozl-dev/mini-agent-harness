[project]
name = "mini-agent-harness"
version = "0.1.0"
description = "A minimal, auditable agent harness: loop control, state persistence, context budgeting, tool governance, layered memory and planning-based retrieval."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "guozl-dev" }]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    # MCP bridge. mcp is pinned below 2.0 because mcpadapt 0.1.x imports the
    # mcp 1.x module layout (mcp.client.streamable_http.streamablehttp_client).
    # mcpadapt 0.1.20 requires Python >= 3.12, so the floor stays at 0.1.19 to
    # keep the 3.11 CI leg installable.
    "mcp>=1.30,<2",
    "mcpadapt>=0.1.19",
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_harness"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/mini_harness"]
